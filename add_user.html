<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New User | Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7fe;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-section i {
            font-size: 3rem;
            color: #4e73df;
            margin-bottom: 15px;
        }

        .header-section h2 {
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
        }

        .input-group-text {
            background-color: #f8f9fc;
            border-right: none;
            color: #b7b9cc;
        }

        .form-control, .form-select {
            border-left: none;
            padding: 12px;
            border-radius: 0 10px 10px 0;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: none;
            border-color: #4e73df;
        }

        /* Specific border-radius for the left icon box */
        .input-group > .input-group-text {
            border-radius: 10px 0 0 10px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.4);
            color: white;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #858796;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: #4e73df;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-section">
        <i class="fa-solid fa-user-plus"></i>
        <h2>Add New User</h2>
        <p class="text-muted small">System mein naya member add karein</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="name@company.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Temporary Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Assign Role</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                <select name="role" class="form-select" required>
                    <option value="" disabled selected>-- Select Access Level --</option>
                    
                    {% if session['role'] == 'admin' %}
                        <option value="admin">Admin (Full Access)</option>
                        <option value="manager">Manager (Project Lead)</option>
                        <option value="customer">Customer (Client)</option>
                    {% endif %}
                    
                    <option value="employee">Employee (Team Member)</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-submit">
            <i class="fa-solid fa-plus-circle me-2"></i> Create User Account
        </button>
    </form>

    <a href="/dashboard" class="back-link">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
    </a>
</div>

</body>
</html>
