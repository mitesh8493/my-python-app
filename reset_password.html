<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Secure Access</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            /* Background decoration */
            background-image: radial-gradient(#dee2e6 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 25px;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Top Accent Bar */
        .reset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
        }

        .security-icon {
            width: 70px;
            height: 70px;
            background: #f0f7ff;
            color: #3a7bd5;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin: 0 auto 25px;
            transform: rotate(-10deg);
            transition: all 0.3s ease;
        }

        .reset-card:hover .security-icon {
            transform: rotate(0deg) scale(1.1);
        }

        .title {
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 2px solid #edf2f7;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #3a7bd5;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(58, 123, 213, 0.1);
        }

        .btn-update {
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-update:hover {
            box-shadow: 0 10px 20px rgba(58, 123, 213, 0.3);
            transform: translateY(-2px);
            color: white;
        }

        .password-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: -15px;
            margin-bottom: 20px;
            display: block;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="security-icon">
        <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h3 class="title">Reset Password</h3>
    <p class="subtitle">Set your new and strong password.</p>

    <form action="/reset_password" method="POST">
        <input type="hidden" name="email" value="{{email}}">

        <div class="mb-3">
            <label class="form-label">New Password</label>
            <div class="input-group">
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Create new password" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
            </div>
        </div>
        
        <span class="password-hint"><i class="fa-solid fa-circle-info me-1"></i> Make sure passwords match.</span>

        <button type="submit" class="btn btn-update">
            Update Password <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>
    </form>

    <div class="footer-text">
        <i class="fa-solid fa-lock me-1"></i> End-to-end encrypted session
    </div>
</div>

<script>
    // Optional: Add simple client-side validation
    const form = document.querySelector('form');
    const pass = document.getElementById('new_password');
    const confirmPass = document.getElementById('confirm_password');

    form.onsubmit = function(e) {

    if (pass.value !== confirmPass.value){
        e.preventDefault();
            alert("Passwords do not match! Please check again.");
        }
    };
</script>

</body>
</html>
