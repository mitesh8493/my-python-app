<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Reset Access</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #8ec5fc 0%, #e0c3fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* Unique Floating Background Elements */
        .bg-circle {
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(40px);
            animation: float 10s infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-50px) rotate(20deg); }
        }

        .forgot-card {
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            font-size: 32px;
            color: #667eea;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .title {
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-control {
            height: 55px;
            border-radius: 15px;
            border: 2px solid #eee;
            padding: 0 20px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
        }

        .btn-submit {
            height: 55px;
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .back-to-login {
            margin-top: 25px;
            display: inline-block;
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .back-to-login i {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="bg-circle" style="width: 300px; height: 300px; top: -50px; left: -50px;"></div>
<div class="bg-circle" style="width: 200px; height: 200px; bottom: -50px; right: -50px; background: rgba(118, 75, 162, 0.2);"></div>

<div class="forgot-card">
    <div class="icon-box">
        <i class="fa-solid fa-lock-open"></i>
    </div>
    
    <h3 class="title">Trouble Logging In?</h3>
    <p class="subtitle">Enter your email address, and we will send you a link to reset your password..</p>

    <form action="/check_email" method="POST">
        <div class="mb-4">
            <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
        </div>

        <button type="submit" class="btn btn-submit w-100">Send Reset Link</button>
    </form>

    <a href="/login" class="back-to-login">
        <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
</div>

</body>
</html>
