<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About {{company[1]}}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2563eb;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .about-card {
            max-width: 750px;
            margin: auto;
            background: #ffffff;
            border: none;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }

        .about-card:hover {
            transform: translateY(-5px);
        }

        .card-header-custom {
            background: #fff;
            padding: 40px 30px 20px;
            text-align: center;
        }

        .logo-wrapper {
            background: #f8fafc;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            padding: 15px;
        }

        .logo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .company-name {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 2rem;
            letter-spacing: -0.5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px;
            background: #fdfdfd;
        }

        .info-item {
            padding: 15px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #f1f5f9;
            transition: all 0.2s;
        }

        .info-item:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .info-value {
            color: var(--text-dark);
            font-weight: 500;
            font-size: 1rem;
        }

        .btn-dashboard {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            margin-bottom: 30px;
            border: none;
        }

        .btn-dashboard:hover {
            background: #1d4ed8;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            color: white;
        }

        .icon-box {
            color: var(--primary-color);
            margin-right: 8px;
            width: 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="about-card">
        <div class="card-header-custom">
            <div class="logo-wrapper">
                {% if company[10] %}
                    <img src="{{ url_for('static', filename='logos/' + company[10]) }}" class="logo-img" alt="Logo">
                {% else %}
                    <i class="fas fa-building fa-3x text-muted"></i>
                {% endif %}
            </div>
            <h2 class="company-name">{{company[1]}}</h2>
            <p class="text-muted mt-2 px-4">
                Empowering businesses with efficient task management, project tracking, and employee collaboration.
            </p>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">Address</span>
                <div class="info-value"><i class="fas fa-map-marker-alt icon-box"></i>{{company[5]}}</div>
            </div>
            <div class="info-item">
                <span class="info-label">Location</span>
                <div class="info-value"><i class="fas fa-city icon-box"></i>{{company[6]}}, {{company[7]}}</div>
            </div>
            <div class="info-item">
                <span class="info-label">Phone Number</span>
                <div class="info-value"><i class="fas fa-phone icon-box"></i>{{company[4]}}</div>
            </div>
            <div class="info-item">
                <span class="info-label">Email Address</span>
                <div class="info-value"><i class="fas fa-envelope icon-box"></i>{{company[3]}}</div>
            </div>
        </div>

        <div class="text-center">
            <a href="/admin" class="btn-dashboard">
                <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>

</body>
</html>
