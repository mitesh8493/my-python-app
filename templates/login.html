<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(45deg, #4158D0, #C850C0, #FFCC70);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .title {
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #555;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1.5px solid #eee;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-group-text {
            background: white;
            border-radius: 0 12px 12px 0 !important;
            border-left: none;
            cursor: pointer;
            color: #666;
        }

        .password-input {
            border-right: none;
        }

        .btn-custom {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-custom:hover {
            opacity: 0.9;
            transform: scale(1.02);
            color: white;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
        }

        .forgot-link {
            text-decoration: none;
            font-size: 0.85rem;
            color: #764ba2;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #4158D0;
            text-decoration: underline;
        }

        .register-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
        }

        .btn-register {
            background-color: transparent;
            border: 2px solid #764ba2;
            color: #764ba2;
            border-radius: 12px;
            font-weight: 600;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: #764ba2;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="title">Welcome Back</h3>

    <form action="/login_user" method="POST">
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="mb-2">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" id="password" name="password" class="form-control password-input" placeholder="••••••••" required>
                <span class="input-group-text" onclick="togglePassword()">
                    <i class="fa-solid fa-eye" id="toggleIcon"></i>
                </span>
            </div>
        </div>

        <div class="text-end mb-4">
            <a href="/forgot_password" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-custom w-100">Sign In</button>
    </form>

    <div class="register-section">
        <p class="small text-muted mb-3">Don't have an account yet?</p>
        <a href="/register" class="btn btn-register w-100">Create New Account</a>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");
        
        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
