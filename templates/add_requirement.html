<!DOCTYPE html>
<html>
<head>
<title>Add Requirement</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h3>Add Project Requirement</h3>

<form method="POST">

    <input type="text" name="title" placeholder="Project Title" class="form-control mb-3" required>

    <textarea name="description" placeholder="Describe your requirement..." class="form-control mb-3" required></textarea>

    <button class="btn btn-success">Submit</button>

</form>

</div>

</body>
</html>
