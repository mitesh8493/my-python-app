<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        function toggleDepartment() {
            let role = document.getElementById("role").value;
            let deptDiv = document.getElementById("deptDiv");

            if (role === "employee") {
                deptDiv.style.display = "block";
            } else {
                deptDiv.style.display = "none";
            }
        }

        window.onload = toggleDepartment;
    </script>

    <style>
        body{
            background:#f4f6f9;
            font-family:'Segoe UI', sans-serif;
        }

        .card{
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,0.1);
        }

        .btn-custom{
            background:#4CAF50;
            color:white;
            border-radius:10px;
        }

        .btn-custom:hover{
            background:#45a049;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card p-4 mx-auto" style="max-width:500px;">
        
        <h3 class="text-center mb-4">✏️ Edit User</h3>

        <form method="POST">

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" value="{{user[1]}}" class="form-control" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{user[2]}}" class="form-control" required>
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" id="role" class="form-control" onchange="toggleDepartment()">

                    {% if session['role'] == 'admin' %}
                        <option value="admin" {% if user[4]=='admin' %}selected{% endif %}>Admin</option>
                        <option value="manager" {% if user[4]=='manager' %}selected{% endif %}>Manager</option>
                    {% endif %}

                    <option value="employee" {% if user[4]=='employee' %}selected{% endif %}>Employee</option>

                </select>
            </div>

            <!-- Department (only for employee) -->
            <div class="mb-3" id="deptDiv" style="display:none;">
                <label class="form-label">Department</label>
                <select name="dept_id" class="form-control">
                    <option value="">Select Department</option>
                    {% for d in departments %}
                        <option value="{{d[0]}}" {% if user[15] == d[0] %}selected{% endif %}>
                            {{d[1]}}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-custom">Update User</button>
                <a href="/users" class="btn btn-secondary">Back</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
