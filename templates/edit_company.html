<!DOCTYPE html>
<html>
<head>
<title>Edit Company</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.form-box{
    max-width:700px;
    margin:50px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.logo{
    height:70px;
    width: auto;
    object-fit:contain;
    margin-bottom:10px;
}
</style>

</head>

<body>

<div class="form-box">

    <h3 class="mb-3 text-center">Edit Company Profile</h3>

    <!-- Current Logo -->
   {% set logo = company[-1] %}

{% if logo %}
    <div class="text-center">
        <img src="{{ url_for('static', filename='logos/' ~ logo) }}" 
             style="height:100px; border:2px solid red;">
    </div>
{% else %}
    No Logo
{% endif %}
    <form method="POST" action="/update_company" enctype="multipart/form-data">

        <div class="mb-2">
            <label>Company Name</label>
            <input type="text" name="company_name" value="{{company[1]}}" class="form-control" required>
        </div>

         <div class="mb-2">
            <label>owner Name</label>
            <input type="text" name="owner_name" value="{{company[2]}}" class="form-control" required>
        </div>


        <div class="mb-2">
            <label>Email</label>
            <input type="email" name="email" value="{{company[3]}}" class="form-control">
        </div>

        <div class="mb-2">
            <label>phone</label>
            <input type="text" name="phone" value="{{company[4]}}" class="form-control">
        </div>

        <div class="mb-2">
            <label>Address</label>
            <textarea name="address" class="form-control">{{company[5]}}</textarea>
        </div>

        <div class="mb-2">
            <label>City</label>
            <input type="text" name="city" value="{{company[6]}}" class="form-control">
        </div>

        <div class="mb-2">
            <label>State</label>
            <input type="text" name="state" value="{{company[7]}}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Change Logo</label>
            <input type="file" name="logo" class="form-control">
        </div>

        <button class="btn btn-primary w-100">Update Company</button>
        
       
    </form>

</div>

</body>
</html>
