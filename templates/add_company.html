<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Company | {{company[1]}}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card-accent {
            height: 6px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
        }

        .form-header {
            padding: 30px 40px 10px;
        }

        .form-header h3 {
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .form-label i {
            margin-right: 8px;
            color: var(--primary);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .logo-preview-box {
            border: 2px dashed #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            background: #f8fafc;
            margin-bottom: 20px;
        }

        .current-logo {
            max-height: 80px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin: 20px 0 15px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
            margin-left: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="form-card">
                <div class="card-accent"></div>
                
                <div class="form-header text-center">
                    <div class="mb-2">
                        <i class="bi bi-building-add fs-1 text-primary"></i>
                    </div>
                    <h3>Registration</h3>
                    <p class="text-muted small">Enter the company details to create a new profile</p>
                </div>

                <div class="p-4 p-md-5 pt-md-2">
                    <form method="POST" enctype="multipart/form-data">
                        
                        <div class="section-title">General Information</div>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label"><i class="bi bi-briefcase"></i> Company Name</label>
                                <input type="text" name="company_name" class="form-control" placeholder="e.g. Google" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label"><i class="bi bi-person-badge"></i> Owner Name</label>
                                <input type="text" name="owner_name" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label"><i class="bi bi-envelope"></i> Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="contact@company.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label"><i class="bi bi-telephone"></i> Phone Number</label>
                                <input type="text" name="phone" class="form-control" placeholder="+91 00000 00000">
                            </div>
                        </div>

                        <div class="section-title">Location Details</div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-geo-alt"></i> Office Address</label>
                            <textarea name="address" class="form-control" rows="2" placeholder="Full street address..."></textarea>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">City</label>
                                <input type="text" name="city" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">State</label>
                                <input type="text" name="state" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Pincode</label>
                                <input type="text" name="pincode" class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Country</label>
                                <input type="text" name="country" class="form-control" placeholder="India">
                            </div>
                        </div>

                        <div class="section-title">Branding</div>

                        <div class="row align-items-center">
                            <div class="col-md-7">
                                <label class="form-label"><i class="bi bi-image"></i> Company Logo</label>
                                <input type="file" name="logo" class="form-control">
                                <small class="text-muted">Recommended: Square PNG or JPG</small>
                            </div>
                            <div class="col-md-5 text-center mt-3 mt-md-0">
                                <div class="logo-preview-box">
                                    {% if logo %}
                                        <img src="{{ url_for('static', filename='logos/' ~ logo) }}" class="current-logo">
                                        <div class="small text-muted mt-1">Current Logo</div>
                                    {% else %}
                                        <div class="text-muted small">
                                            <i class="bi bi-cloud-upload fs-3 d-block"></i>
                                            No Logo Uploaded
                                        </div>
                                    {% endif %}
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-submit w-100">
                                <i class="bi bi-check2-circle me-2"></i> Register Company
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <a href="/admin" class="text-decoration-none small text-muted">
                                <i class="bi bi-arrow-left"></i> Cancel and go back
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
