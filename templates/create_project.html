<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }

        .create-project-container {
            max-width: 700px;
            margin: 60px auto;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .create-project-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #0d6efd;
        }

        .project-form .form-control, 
        .project-form textarea, 
        .project-form .form-select {
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .project-form button {
            width: 100%;
            background-color: #0d6efd;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            transition: background 0.3s;
        }

        .project-form button:hover {
            background-color: #0b5ed7;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #0d6efd;
            font-weight: bold;
        }

        .back-btn:hover {
            color: #0b5ed7;
            text-decoration: underline;
        }

        label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="create-project-container">
    <h1>Create New Project</h1>

    <form action="/add_project" method="POST" class="project-form" enctype="multipart/form-data">

        <label for="project_name">Project Name</label>
        <input type="text" id="project_name" name="project_name" placeholder="Enter Project Name" class="form-control" required>

        <label for="description">Project Description</label>
        <textarea id="description" name="description" placeholder="Enter Project Description" class="form-control"></textarea>

        <label for="assigned_to">Assign To</label>
        <select name="assigned_to">
    {% for emp in employees %}
        <option value="{{ emp[1] }}">{{ emp[0] }}</option>
    {% endfor %}
</select>
        <label for="deadline">Deadline</label>
        <input type="date" id="deadline" name="deadline" class="form-control" required>
        
        <label for="document">Add document</label>
        <input type="file" name="document"><br>


        <button type="submit">Create Project</button>
    </form>

    <a href="/admin" class="back-btn">&larr; Back to Admin Dashboard</a>
</div>

</body>
</html>
